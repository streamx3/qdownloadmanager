<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Download Helper</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header><img class="mark" src="icons/icon-128.png" width="30" height="30" alt=""><h1>Download Helper</h1></header>
  <section class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">Checking app…</span></div><p id="detail">Looking for the local app on this computer.</p><button id="connect" class="primary block">Connect</button></section>
  <section><h2>Save images in one click</h2><p>Use the ↓ button on images on your enabled websites. Keep Download Helper running.</p><p class="muted" id="sites"></p></section>
  <p id="feedback" role="status"></p>
  <footer><button class="ghost block" id="options">Website & transfer settings</button></footer>
  <script type="module" src="popup.js"></script>
</body></html>
